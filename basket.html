<!doctype html>
<html lang="en">

<head>
    <!-- meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- bootstrap css stuff-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <!-- bootstrap js stuff -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>

    <!-- google fonts -->
    <!-- when adding new icons, put into the list at end "icon_names", must be comma separated and in alphabetical order a-z -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=shopping_cart" />

    <!-- rename "generic" to whatever the page is -->
    <title>Miku Fan Club | Basket </title>

    <link rel="icon" href="assets/logo/miku_logo_WOshadow.png" type="image/x-icon">

    <!-- custom css and js -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
</head>

<body onload="addStars(), getComponents()" class="d-flex flex-column min-vh-100 stars">

    <!-- Navbar is loaded here by script.js -->
    <div id="navbar"></div>

    <img src="/assets/banners/banner_checkout.png" class="banner">

    <!-- Main Content wrapper that your addStars() script expects -->
    <div class="page-content bg-light">
        <div class="container py-5 position-relative">
            <div class="row">

                <!-- ===== ITEM LIST (Left Column on Desktop) ===== -->
                <div class="col-lg-8">

                    <!-- Item 1 -->
                    <div class="cart-item pr-3">
                        <div class="d-flex align-items-center">
                            <img src="assets/products/keyM.png" alt="Hatsune Miku Keychain" class="img-fluid rounded mr-3">
                            <div class="item-details flex-grow-1">
                                <h5>Hatsune Miku Keychain</h5>
                                <div class="d-flex align-items-center mt-2">
                                    <select class="form-control form-control-sm" style="width: 65px;">
                                        <option selected>1</option>
                                        <option>2</option>
                                        <option>3</option>
                                        <option>4</option>
                                    </select>
                                    <span class="font-weight-bold ml-3">£4.00</span>
                                </div>
                            </div>
                            <a href="#" class="remove-item ml-3" title="Remove Item">&times;</a>
                        </div>
                    </div>
                    <hr>

                    <!-- Item 2 -->
                    <div class="cart-item pr-3">
                        <div class="d-flex align-items-center">
                            <img src="assets/products/cupT.png" alt="Kasane Teto Shaker Bottle" class="img-fluid rounded mr-3">
                            <div class="item-details flex-grow-1">
                                <h5>Kasane Teto Shaker Bottle</h5>
                                <div class="d-flex align-items-center mt-2">
                                    <select class="form-control form-control-sm" style="width: 65px;">
                                        <option selected>1</option>
                                        <option>2</option>
                                        <option>3</option>
                                        <option>4</option>
                                    </select>
                                    <span class="font-weight-bold ml-3">£8.00</span>
                                </div>
                            </div>
                            <a href="#" class="remove-item ml-3" title="Remove Item">&times;</a>
                        </div>
                    </div>
                    <hr>
                    
                    <!-- Item 3 -->
                    <div class="cart-item pr-3">
                        <div class="d-flex align-items-center">
                            <img src="assets/products/powderN.png" alt="Akita Neru Powder" class="img-fluid rounded mr-3">
                            <div class="item-details flex-grow-1">
                                <h5>Akita Neru Powder</h5>
                                <div class="d-flex align-items-center mt-2">
                                    <select class="form-control form-control-sm" style="width: 65px;">
                                        <option selected>1</option>
                                        <option>2</option>
                                        <option>3</option>
                                        <option>4</option>
                                    </select>
                                    <span class="font-weight-bold ml-3">£12.00</span>
                                </div>
                            </div>
                            <a href="#" class="remove-item ml-3" title="Remove Item">&times;</a>
                        </div>
                    </div>
                    <hr class="d-lg-none"> <!-- Only show last hr on mobile -->

                </div>

                <!-- ===== SUMMARY (Right Column on Desktop) ===== -->
                <div class="col-lg-4">
                    <div class="card summary-card border-0 order-summary">
                        <div class="card-body">
                            <h5 class="card-title">Summary</h5>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal</span>
                                <span>£24.00</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span>Shipping</span>
                                <span>£3.50</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between font-weight-bold">
                                <h6>Total</h6>
                                <h6>£27.50</h6>
                            </div>
                            <a href="#" class="btn btn-primary btn-block mt-3">Proceed to Checkout</a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>


    <!-- Footer is loaded here by script.js -->
    <div id="footer" class="mt-auto"></div>

    <!-- Scripts -->
     <script src="js/script.js"></script>
</body>

</html>
